# pages.yml — deploy docs-site/ to GitHub Pages on push to main.
# workflow_dispatch runs the first deployment once Pages is enabled with the
# "GitHub Actions" source; a push that touches none of the paths below deploys
# nothing.
name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "catalogue.jsonld"
      - "leaderboard/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs-site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
