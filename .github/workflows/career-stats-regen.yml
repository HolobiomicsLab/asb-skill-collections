# career-stats-regen.yml — rebuilds leaderboard/ files on push to main when reviews
# or contributors.jsonld change, and proposes them to main in a pull request from
# the bot branch bot/career-stats (nothing here pushes to main).
name: Career Stats Regen

on:
  push:
    branches:
      - main
    paths:
      - "collections/**/reviews/*.yaml"
      - "contributors.jsonld"

permissions:
  contents: write        # push the bot branch
  pull-requests: write   # open the pull request

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Rebuild leaderboard stats
        run: |
          python scripts/regen_career_stats.py --repo-root .
          echo "Career stats rebuilt"

      - name: Propose the updated leaderboard files in a pull request
        # The regeneration is complete on every run, so one fixed bot branch
        # carries the latest one and a single pull request from it stays open.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/bot_pull_request.sh bot/career-stats \
            "chore: regen leaderboard stats" leaderboard/
