# release.yml — triggered on tags matching <collection-slug>-v<N>
# Steps:
#   1. Validate the tagged collection passes all CI gates (pytest)
#   2. Run release_gate.py --strict on the tagged collection and keep the receipt.
#      This is the last measurement before anything leaves the repository, and it
#      blocks. promote-collection.yml runs the same gate on `collections/**` pull
#      requests, which is a different population from "what a tag points at".
#   3. Call regen_catalogue.py and propose the updated catalogue.jsonld in a
#      pull request from a bot branch (nothing here pushes to main)
#   4. Upload the collection directory to Zenodo, only when the repository
#      variable ZENODO_UPLOAD is `true` (unset by default; see the step)
#   5. Update CITATION.cff with the minted DOI, in a pull request from a bot branch
#   6. Trigger mirror-to-hf.yml via workflow_dispatch
name: Release

on:
  push:
    tags:
      - "*-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)run, e.g. metabolomics-v0.1.0"
        required: true
        type: string

permissions:
  contents: write        # push the bot branches of the pull requests below
  pull-requests: write   # open those pull requests

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # On manual dispatch, check out the requested tag's content.
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract collection slug and version from tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          # Tag format: <slug>-v<release-version>  e.g. metabolomics-v0.1.0
          SLUG="${TAG%-v*}"
          # The release/tag version (e.g. 0.1.0) is independent of the on-disk
          # collection directory version (collections/<slug>/v<N>). Resolve the
          # actual collection dir = highest v<N> for this slug.
          COLL_VERSION="$(ls -d collections/${SLUG}/v* 2>/dev/null | sed 's#.*/v##' | sort -n | tail -1)"
          if [ -z "${COLL_VERSION}" ]; then
            echo "::error::no collection dir found under collections/${SLUG}/v*"; exit 1
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "version=${COLL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=${TAG} -> slug=${SLUG} collection dir v${COLL_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # CPU torch first, so the sentence-transformers pin in the test extra
          # does not pull the CUDA wheel.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      # The S6 tests load BAAI/bge-small-en-v1.5 offline (HF_HUB_OFFLINE=1), so
      # the model is staged into the Hugging Face cache before the suite runs.
      - name: Stage the S6 embedding model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"

      - name: Run CI validation gates
        run: |
          python -m pytest tests/ -v
          echo "All CI gates passed"

      - name: Release gate (strict) on the tagged collection
        # The last gate before anything leaves the repository. `promote-collection.yml`
        # runs this on pull requests touching `collections/**`, which is not the same
        # population as "what a tag points at": a tag can be cut from a commit whose
        # PR touched only `scripts/` or `governance/`, and a tag can be re-run by
        # `workflow_dispatch` against a ref that never went through promotion at all.
        # Without this step the strict measurement is skipped on exactly the run that
        # uploads the collection to Zenodo.
        #
        # Blocking on purpose. Under `--strict` a FAIL on a *soft* check blocks too,
        # so a content defect the promotion PR left open stops the release rather than
        # shipping with it. `governance/CONTENT_POLICY.md` describes a `degraded_release`
        # override for soft gates; `release_gate.py` does not implement one, so today
        # the only route past a soft FAIL is to fix it — which is the safe direction
        # for a first release, and the gap is recorded rather than worked around here.
        env:
          COLLECTION_SLUG: ${{ steps.tag.outputs.slug }}
          COLLECTION_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          dir="collections/${COLLECTION_SLUG}/v${COLLECTION_VERSION}"
          test -f "${dir}/corpus.yaml" || {
            echo "::error::${dir}/corpus.yaml missing — nothing to gate"; exit 1; }
          python scripts/release_gate.py collections --catalogue-membership
          python scripts/release_gate.py "${dir}" --strict --report "${dir}/gate_report.json"
          echo "Strict release gate passed for ${dir}"

      - name: Upload the gate receipt
        # Keep the measurement even when the gate blocked — a failed release is
        # exactly when the report is worth reading.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-${{ steps.tag.outputs.tag }}
          path: collections/${{ steps.tag.outputs.slug }}/v${{ steps.tag.outputs.version }}/gate_report.json
          if-no-files-found: warn

      - name: Regenerate catalogue.jsonld
        run: |
          python scripts/regen_catalogue.py --repo-root . --output catalogue.jsonld
          echo "catalogue.jsonld regenerated"

      - name: Propose the updated catalogue.jsonld in a pull request (fail-soft)
        # main changes only through pull requests: the regenerated catalogue is
        # committed on top of the tagged commit, on the bot branch
        # bot/catalogue-<tag>, and proposed to main. Best-effort only: never fail
        # the release over the catalogue (it is regenerated on main separately).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/bot_pull_request.sh "bot/catalogue-${RELEASE_TAG}" \
            "chore: regen catalogue.jsonld for ${RELEASE_TAG}" catalogue.jsonld

      - name: Propose release co-authors from leaderboard (advisory)
        # Turns the measured contribution record into a PROPOSED author list for
        # this release. Advisory only — it writes the proposal to the job summary
        # and never mutates CITATION.cff/.zenodo.json automatically (a maintainer
        # injects reviewed authors via select_release_coauthors.py --apply in a PR).
        continue-on-error: true
        env:
          COLLECTION_SLUG: ${{ steps.tag.outputs.slug }}
        run: |
          python scripts/regen_career_stats.py --repo-root . || true
          python scripts/select_release_coauthors.py --repo-root . \
            --collection "${COLLECTION_SLUG}" --recent-years 2 \
            --report release_coauthors.md --json release_coauthors.json || true
          if [ -f release_coauthors.md ]; then
            cat release_coauthors.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::notice::Co-author proposal is ADVISORY. Inject reviewed authors with select_release_coauthors.py --apply (CITATION.cff / .zenodo.json) in a PR before tagging."

      - name: Upload to Zenodo (only when ZENODO_UPLOAD is true)
        # Off unless the repository variable ZENODO_UPLOAD is `true`. Zenodo keeps
        # one unpublished new version per record, so a draft made here collides
        # with the draft of scripts/zenodo_deposit.py, the documented deposit
        # path: the version is published by hand first, its DOI recorded in a
        # pull request, then the tag is pushed (docs/RELEASE_DEPOSIT.md). With
        # the variable unset, a tag run makes no Zenodo request, and the
        # CITATION.cff step below is skipped since no DOI is output.
        if: vars.ZENODO_UPLOAD == 'true'
        id: zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_PUBLISH: ${{ vars.ZENODO_PUBLISH }}
          ZENODO_SANDBOX: ${{ vars.ZENODO_SANDBOX }}
          COLLECTION_SLUG: ${{ steps.tag.outputs.slug }}
          COLLECTION_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "${ZENODO_TOKEN}" ]; then
            echo "ZENODO_TOKEN not set — skipping Zenodo upload"
            echo "doi=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PYEOF'
          import json, os, pathlib, re, requests, sys, zipfile, tempfile

          token = os.environ["ZENODO_TOKEN"]
          slug = os.environ["COLLECTION_SLUG"]
          version = os.environ["COLLECTION_VERSION"]
          collection_dir = pathlib.Path("collections") / slug / f"v{version}"

          if not collection_dir.exists():
            print(f"Collection dir not found: {collection_dir}", file=sys.stderr)
            sys.exit(1)

          headers = {"Authorization": f"Bearer {token}"}
          sandbox = os.environ.get("ZENODO_SANDBOX", "").lower() == "true"
          base_url = "https://sandbox.zenodo.org/api" if sandbox else "https://zenodo.org/api"
          print(f"Zenodo target: {'SANDBOX' if sandbox else 'PRODUCTION'} ({base_url})")

          # ---- Resolve the Zenodo concept record for version lineage ----
          # Read any prior-version DOI from the collection's OWN metadata so no DOI
          # is hardcoded in CI (generalize-or-stop). ZENODO_CONCEPT_RECORD overrides.
          # A "new version" keeps the concept DOI stable and mints a fresh version
          # DOI — exactly like clicking "New version" in the Zenodo UI. Falls back to
          # a brand-new deposition for a collection's first-ever release.
          def _concept_record():
            override = os.environ.get("ZENODO_CONCEPT_RECORD", "").strip()
            if override:
              return override
            zjp = collection_dir / ".zenodo.json"
            if not zjp.exists():
              return ""
            meta0 = json.loads(zjp.read_text())
            version_relations = {"isversionof", "isnewversionof", "ispreviousversionof"}
            for rid in (meta0.get("related_identifiers") or []):
              if str(rid.get("relation", "")).lower() in version_relations:
                m = re.search(r"zenodo[./](\d+)", str(rid.get("identifier", "")))
                if m:
                  return m.group(1)
            return ""

          concept_record = _concept_record()
          if concept_record:
            nv = requests.post(
              f"{base_url}/deposit/depositions/{concept_record}/actions/newversion",
              headers=headers, timeout=30)
            nv.raise_for_status()
            dep = requests.get(nv.json()["links"]["latest_draft"], headers=headers, timeout=30).json()
            dep_id = dep["id"]
            bucket_url = dep["links"]["bucket"]
            # Drop files inherited from the previous version; we re-upload current artifacts.
            for old in dep.get("files", []):
              fid = old.get("id")
              if fid:
                dresp = requests.delete(
                  f"{base_url}/deposit/depositions/{dep_id}/files/{fid}",
                  headers=headers, timeout=30)
                dresp.raise_for_status()  # else the old file persists alongside the new one
            print(f"Created NEW VERSION draft {dep_id} of Zenodo concept record {concept_record}")
          else:
            resp = requests.post(f"{base_url}/deposit/depositions",
                json={}, headers=headers, timeout=30)
            resp.raise_for_status()
            dep = resp.json()
            dep_id = dep["id"]
            bucket_url = dep["links"]["bucket"]
            print(f"Created NEW deposition {dep_id} (no prior concept record found — first release)")

          # Zip the collection directory + bundle the Perspicacité grounding
          # binder (+ deps + agent guide) so the deposit is self-contained:
          # users can run the KB grounding from the archive alone. The license
          # texts are required, as in scripts/zenodo_deposit.py.
          license_files = ["LICENSING.md", "LICENSE", "governance/LICENSE_TIERS.md"]
          missing = [p for p in license_files if not pathlib.Path(p).is_file()]
          if missing:
            print(f"License texts not found: {missing}", file=sys.stderr)
            sys.exit(1)
          with tempfile.NamedTemporaryFile(suffix=".zip", delete=False) as tf:
            zip_path = tf.name
          arc_root = f"{slug}/v{version}"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
            for f in sorted(collection_dir.rglob("*")):
              if f.is_file():
                zf.write(f, f.relative_to(collection_dir.parent.parent))
            for src, arc in [
              ("scripts/perspicacite_kb_bind.py", f"{arc_root}/scripts/perspicacite_kb_bind.py"),
              ("scripts/requirements.txt",        f"{arc_root}/scripts/requirements.txt"),
              ("AGENTS.md",                        f"{arc_root}/AGENTS.md"),
              ("LICENSING.md",                     f"{arc_root}/LICENSING.md"),
              ("LICENSE",                          f"{arc_root}/LICENSE"),
              ("governance/LICENSE_TIERS.md",      f"{arc_root}/governance/LICENSE_TIERS.md"),
            ]:
              p = pathlib.Path(src)
              if p.is_file():
                zf.write(p, arc)

          # Upload zip
          with open(zip_path, "rb") as fh:
            upload_resp = requests.put(
              f"{bucket_url}/{slug}-v{version}.zip",
              data=fh,
              headers=headers,
              timeout=120,
            )
            upload_resp.raise_for_status()
          print(f"Uploaded {slug}-v{version}.zip")

          # ---- Optional: ship the prebuilt leaf embedding cache as a separate file ----
          # Lets Perspicacité users get semantic leaf retrieval without re-embedding
          # thousands of leaves. Fail-soft: only when a maintainer placed the aligned
          # cache (LEAF_EMB_CACHE_PATH override, else a conventional location).
          _cache_env = os.environ.get("LEAF_EMB_CACHE_PATH", "").strip()
          _cache_candidates = [pathlib.Path(_cache_env)] if _cache_env else [
            collection_dir / ".cache" / f"leafemb_v{version}.npz",   # bin/semantic_search.py convention
            collection_dir / ".cache" / f"leafemb_{collection_dir.name}.npz",
          ]
          for _cache_path in _cache_candidates:
            if _cache_path.is_file():
              with open(_cache_path, "rb") as fh:
                _up = requests.put(
                  f"{bucket_url}/{slug}-v{version}-leafemb.npz",
                  data=fh, headers=headers, timeout=300)
                _up.raise_for_status()
              print(f"Uploaded leaf embedding cache from {_cache_path}")
              break
          else:
            print("No leaf embedding cache present — skipping (semantic retrieval re-embeds on first use)")

          # ---- Metadata: prefer a checked-in .zenodo.json, else derive from CITATION.cff ----
          zj = collection_dir / ".zenodo.json"
          if zj.exists():
            metadata = json.loads(zj.read_text())
            print(f"Using metadata from {zj}")
          else:
            import yaml
            citation_path = collection_dir / "CITATION.cff"
            title = f"ASB Skill Collection: {slug} v{version}"
            creators = [{"name": "Holobiomics Lab"}]
            if citation_path.exists():
              cff = yaml.safe_load(citation_path.read_text())
              title = cff.get("title", title)
              creators = []
              for a in cff.get("authors", []):
                if not a:
                  continue
                if a.get("name"):                       # entity author
                  c = {"name": a["name"]}
                else:                                    # person author
                  c = {"name": f"{a.get('family-names','')}, {a.get('given-names','')}".strip(", ")}
                if a.get("orcid"):
                  c["orcid"] = a["orcid"].rsplit("/", 1)[-1]
                creators.append(c)
            metadata = {
              "title": title,
              "upload_type": "dataset",
              "description": f"ASB Skill Collection release: {slug} (collection v{version}).",
              "creators": creators,
              "keywords": ["scientific-agents", "agent-skills", slug, "asb"],
              "license": "cc-by-4.0",
              "access_right": "open",
              "version": os.environ.get("RELEASE_TAG") or os.environ.get("GITHUB_REF_NAME", f"{slug}-v{version}"),
            }

          meta_resp = requests.put(
            f"{base_url}/deposit/depositions/{dep_id}",
            json={"metadata": metadata},
            headers={"Content-Type": "application/json", **headers},
            timeout=30,
          )
          meta_resp.raise_for_status()

          # DRAFT ONLY — do NOT publish. The deposition stays private/editable in
          # Zenodo until a maintainer reviews and clicks Publish (or sets
          # ZENODO_PUBLISH=true to opt in). This keeps the release "not public yet".
          edit_url = dep["links"].get("html", f"https://zenodo.org/deposit/{dep_id}")
          if os.environ.get("ZENODO_PUBLISH", "").lower() == "true":
            pub_resp = requests.post(
              f"{base_url}/deposit/depositions/{dep_id}/actions/publish",
              headers=headers, timeout=30)
            pub_resp.raise_for_status()
            doi = pub_resp.json().get("doi", "")
            print(f"Published. DOI: {doi}")
          else:
            doi = ""
            print(f"Draft created (NOT published). Review & publish here: {edit_url}")
            print(f"Draft deposition id: {dep_id}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gho:
            gho.write(f"doi={doi}\n")
            gho.write(f"draft_id={dep_id}\n")
          PYEOF

      - name: Update CITATION.cff with minted DOI
        # Runs only when the Zenodo step published (ZENODO_UPLOAD and
        # ZENODO_PUBLISH both true). The DOI goes to main in a pull request from
        # the bot branch bot/citation-doi-<tag>, not by a push to main.
        if: steps.zenodo.outputs.doi != ''
        env:
          DOI: ${{ steps.zenodo.outputs.doi }}
          COLLECTION_SLUG: ${{ steps.tag.outputs.slug }}
          COLLECTION_VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PYEOF'
          import os, pathlib, re

          doi = os.environ["DOI"]
          slug = os.environ["COLLECTION_SLUG"]
          version = os.environ["COLLECTION_VERSION"]

          # Update root CITATION.cff if it exists
          root_cff = pathlib.Path("CITATION.cff")
          if root_cff.exists():
            text = root_cff.read_text()
            text = re.sub(r'^(doi:\s*).*$', f'doi: {doi}', text, flags=re.MULTILINE)
            root_cff.write_text(text)
            print(f"Updated root CITATION.cff with doi: {doi}")

          # Update collection-level CITATION.cff
          col_cff = pathlib.Path("collections") / slug / f"v{version}" / "CITATION.cff"
          if col_cff.exists():
            text = col_cff.read_text()
            text = re.sub(r'^(doi:\s*).*$', f'doi: {doi}', text, flags=re.MULTILINE)
            col_cff.write_text(text)
            print(f"Updated collection CITATION.cff with doi: {doi}")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/bot_pull_request.sh "bot/citation-doi-${RELEASE_TAG}" \
            "chore: update CITATION.cff with Zenodo DOI ${DOI}" \
            CITATION.cff "collections/${COLLECTION_SLUG}/v${COLLECTION_VERSION}/CITATION.cff"

      - name: Trigger mirror-to-hf.yml
        # Gated OFF by default — the HuggingFace mirror is not live yet. Set the
        # repo variable ENABLE_HF_MIRROR=true to opt in.
        if: vars.ENABLE_HF_MIRROR == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mirror-to-hf.yml',
              ref: 'main',
              inputs: {
                collection_slug: '${{ steps.tag.outputs.slug }}',
                collection_version: '${{ steps.tag.outputs.version }}'
              }
            });
            console.log('Triggered mirror-to-hf.yml for ${{ steps.tag.outputs.tag }}');
