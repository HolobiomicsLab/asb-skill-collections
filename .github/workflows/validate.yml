# validate.yml -- runs on every PR
# Gates on released content run in each domain repository's pipeline.
# Gate 10 validates .claude-plugin/marketplace.json in the plugin-manifest job.

name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # numpy backs scripts/skill_map.py; without it that suite silently skips.
          pip install pyyaml jsonschema requests pytest numpy
          pip install linkml linkml-runtime || echo "WARNING: linkml install failed"
          pip install rocrate || echo "WARNING: rocrate install failed"
          # indicium-adapters (the verify-claims CLI of gate 9) is not installed:
          # the name is not registered on PyPI. See gate 9.
          # scripts/same_paper_pairs.py (S6) embeds every cut output with the
          # pinned local model BAAI/bge-small-en-v1.5 (Decision 7 thresholds were
          # calibrated on it). Its tests and the driver tests run the real script,
          # so the runner needs sentence-transformers; the CPU torch wheel keeps
          # the install small.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers

      # The S6 tests set HF_HUB_OFFLINE=1, so the model must already be in the
      # Hugging Face cache before the suite runs. Cached across runs by model name.
      - name: Cache the S6 embedding model
        id: hf-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-bge-small-en-v1.5

      - name: Stage the S6 embedding model
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"

      # -- Gate 0: Unit tests -------------------------------------------------
      # Until now the suite ran only inside release.yml, so a test could sit broken
      # on main for weeks and nothing would say so. The suite makes no network
      # call: the one model it loads is staged above and read offline.
      - name: Run test suite
        run: python -m pytest tests/ -q

      # Every-skill index coverage runs in the domain repository's pipeline.

      # Gate 10 (plugin manifest) runs in the plugin-manifest job below.

      # Skill-description lint runs in the domain repository's pipeline.

      # The derived_from DOI sample runs in the domain repository's pipeline.

      # EDAM IRI resolution runs in the domain repository's pipeline.

      # RO-Crate validation runs in the domain repository's pipeline.

      # Gate 9 runs in the domain repository's pipeline.

      # LinkML schema validation runs in the domain repository's pipeline.

      # The pack-derivation gate runs in the domain repository's pipeline.

      # The released-capsule gate runs in the domain repository's pipeline.

      # The advertised-count gate runs in the domain repository's pipeline.

      # The license-tier gate runs in the domain repository's pipeline.

      # The provenance-tier gate runs in the domain repository's pipeline.

  # The tool-catalogue gate runs in the domain repository's pipeline.

  # The release-receipt job runs in the domain repository's pipeline.

  # -- collections.yaml and catalogue.jsonld agree ----------------------------
  manifest:
    name: "Registry manifest and catalogue are consistent"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate the registry manifest
        run: python scripts/check_collections_manifest.py

  # -- docs-site/search_index/ is current -------------------------------------
  # Private domain checkouts are unavailable here, so CI reads none: every
  # registry domain must have an index file whose sha256 and size match
  # search_index/manifest.json and whose registry_digest matches that domain's
  # rows in collections.yaml. A change to one domain leaves the others valid.
  # The domain pipeline rebuilds a domain's file from its verified checkout.
  search-index:
    name: "docs-site/search_index/ matches the registry"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Committed per-domain search index matches the registry
        run: python docs-site/build_search_index.py --check-manifest docs-site/search_index

  # -- CITATION.cff files are valid CFF 1.2.0 ---------------------------------
  # GitHub's "Cite this repository" and Zenodo read CITATION.cff, and an invalid
  # file is misread or ignored without an error. Only the root file remains here;
  # collection citation files are validated in their domain repositories.
  # cffconvert 2.0.0 requires jsonschema<4, so it gets its own environment.
  citation:
    name: "CITATION.cff files are valid CFF 1.2.0"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cffconvert in its own environment
        run: |
          python -m venv "$RUNNER_TEMP/cffconvert"
          "$RUNNER_TEMP/cffconvert/bin/pip" install "cffconvert==2.0.0"

      - name: Validate the root CITATION.cff
        run: '"$RUNNER_TEMP/cffconvert/bin/cffconvert" --validate -i CITATION.cff'

  # -- Gate 10: plugin manifests pass Claude Code's own validator -------------
  # `claude plugin validate --strict .` reads .claude-plugin/marketplace.json the
  # way Claude Code does. Remote plugin sources have no local plugin directories
  # to iterate, so only the marketplace manifest is validated here.
  plugin-manifest:
    name: "Gate 10: plugin manifests validate"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@2.1.304"

      - name: Validate the marketplace manifest
        run: claude plugin validate --strict .claude-plugin/marketplace.json

      - name: Set up Python 3.12 for the registry check
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the marketplace pins against the registry
        run: |
          pip install pyyaml
          python scripts/sync_marketplace.py --check
