    flavour: mf-table
  grounding:
    kb_slugs:
    - asb-paper-10-1021-acs-jnatprod-7b00737
    - asb-paper-10-1038-s41589-020-00677-3
    - asb-paper-10-1101-2024-10-11-617756
    - asb-paper-10-1186-s40168-022-01444-3
    - asb-paper-10-1371-journal-pcbi-1008920
