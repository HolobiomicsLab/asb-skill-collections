  edam_operation: operation_3357
  skills:
  - bgc-mf-link-scoring
  - link-scoring-metcalf-algorithm
  - gcf-mf-link-scoring
  - gcf-mf-link-scoring-computation
  - strain-correlation-hypergeometric-adjustment
  tools:
  - NPLinker
  - antiSMASH
  - BiG-SCAPE
  - MIBiG
  - GNPS
  inputs:
  - type: tsv
    flavour: gcf-table
  - type: tsv
    flavour: mf-table
  outputs:
