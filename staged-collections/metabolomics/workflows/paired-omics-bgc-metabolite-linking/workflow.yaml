schema_version: 0.3.0
workflow_id: paired_omics_bgc_metabolite_linking
kind: composite-workflow
techniques:
- LC-MS
steps:
- id: bgc_mine
  goal: assembled genomes -> detected BGCs (antiSMASH genome mining)
  edam_operation: operation_0436
  skills:
  - biosynthetic-gene-cluster-detection-and-annotation
  - genomic-bgc-extraction-antismash
  - biosynthetic-gene-cluster-annotation
  tools:
  - antiSMASH
  - BiG-SCAPE
  - NPLinker
  - GNPS
  - MIBiG
  inputs:
  - type: fasta
  outputs:
  - type: genbank
    flavour: antismash-bgc
  grounding:
    kb_slugs:
    - asb-paper-10-1093-gigascience-giaa154
    - asb-paper-10-1101-2024-10-11-617756
    - asb-paper-10-1186-s40168-022-01444-3
    - asb-paper-10-1371-journal-pcbi-1008920
    dois:
    - 10.1093/gigascience/giaa154
    - 10.1101/2024.10.11.617756
    - 10.1186/s40168-022-01444-3
    - 10.1371/journal.pcbi.1008920
  after: []
  candidate_tools:
  - Python
  - conda
  - pip
  - BigScape
  - pyHMMER
  - BiG-SLiCE
  - PFAM 35.0
- id: bgc_tokenize
  goal: GenBank BGC records -> Pfam-domain tokens and sub-cluster motifs (iPRESTO)
  edam_operation: operation_3096
