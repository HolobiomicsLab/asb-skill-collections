# Package registries consulted to resolve a TOOL's own licence and repository.
# Human doc: LICENSE_TIERS.md § "Where a tool licence is allowed to come from".
version: 2

# An exact name match is not by itself evidence that a package is the tool a
# paper meant. CRAN carries `AER` (Applied Econometrics with R) and `arrow`
# (Apache Arrow); PyPI carries a deprecated `sklearn` shim and a `docker` SDK
# that is not Docker; Bioconda carries `umap`, a genome mappability tool that is
# not the dimension-reduction method. Every match is therefore judged per record
# by scripts/tool_identity.py, from the record's own evidence in its collection
# (issue #43). `scope` decides how much evidence a match needs:
#
#   life_science  a curated life-science index. In a collection listed under
#                 `life_science_collections`, a distinctive name is accepted
#                 unless the record's evidence contradicts it; a short or
#                 English-word name needs corroboration. Outside those
#                 collections every match needs strong corroboration.
#   general       a general-purpose index. Consulted only with strong
#                 corroboration from the record: the package's repository is
#                 one the record names, a DOI it lists is the record's, or
#                 (CRAN, PyPI) the record uses the name as a package of that
#                 ecosystem (`library(x)`, `import x`, `pip install x`).
#
# `ask_when` limits per-name registries to names the resolver could use an
# answer for, so a name without Python evidence is never sent to PyPI.
registries:
  - id: bioconductor
    scope: life_science
    ecosystem: r
    detection: bioconductor-package
    # r-universe mirrors Bioconductor's metadata in one request, licence included;
    # bioconductor.org is not reachable from every network.
    index_url: https://bioc.r-universe.dev/api/packages?fields=Package,Title,Description,License,URL,BugReports,biocViews&limit=100000
    index_shape: records_list
    name_field: Package
    license_field: License
    license_format: r_description_field
    repo_fields: [URL, BugReports]
    text_fields: [Title, Description]
    address: https://bioconductor.org/packages/{name}

  - id: bioconda
    scope: life_science
    ecosystem: conda
    detection: bioconda-package
    # channeldata.json carries licence and repository inline for every package, so
    # the whole registry is one request and matching is offline afterwards.
    index_url: https://conda.anaconda.org/bioconda/channeldata.json
    index_shape: packages_map
    license_field: license
    license_format: spdx_or_text
    repo_fields: [dev_url, home]
    text_fields: [summary, description]
    address: https://anaconda.org/bioconda/{name}

  - id: cran
    scope: general
    ecosystem: r
    detection: cran-package
    # The CRAN package database, all DESCRIPTION fields, in one request.
    index_url: https://cran.r-project.org/web/packages/packages.rds
    index_shape: rds_matrix
    name_field: Package
    keep_fields: [Package, Title, Description, License, License_restricts_use, URL, BugReports]
    license_field: License
    license_format: r_description_field
    repo_fields: [URL, BugReports]
    text_fields: [Title, Description]
    address: https://cran.r-project.org/package={name}

  - id: pypi
    scope: general
    ecosystem: python
    detection: pypi-package
    index_shape: per_name
    ask_when: code_python
    package_url: https://pypi.org/pypi/{name}/json
    license_field: license
    license_format: pypi_info
    repo_fields: [project_urls, home_page]
    text_fields: [summary]
    address: https://pypi.org/project/{name}/

  - id: biotools
    scope: general
    ecosystem: null
    detection: biotools-entry
    index_shape: per_name
    # bio.tools answers name searches, not a bulk list. Asked only when the record
    # looks like it carries the tool's own paper or repository, which is the only
    # evidence on which its answer is accepted.
    ask_when: introducing_hint
    answer_shape: biotools_search
    package_url: https://bio.tools/api/tool/?name={name}&format=json
    license_field: license
    license_format: biotools
    repo_fields: [homepage, link]
    text_fields: [description]
    address: https://bio.tools/{name}

# Collections whose subject is the life sciences, where a curated life-science
# registry supplies the domain constraint a name match needs. A collection not
# listed here (astronomy and agentic-ai today, and any new domain until it is
# added) needs strong corroboration for every match: that is how the language
# model BERT stopped resolving to a Bioconductor package and the particle-physics
# GAMBIT to a microbial typing tool.
life_science_collections: [proteomics, genomics, metagenomics, metabarcoding, multi-omics,
                           transcriptomics, epigenomics, metabolomics]

# ---------------------------------------------------------------------------
# Reviewed exclusions.
#
# Every registry match was checked by hand once, on 2026-08-21, across 94
# matches. These are the ones where the registry package is a different project
# that happens to share the tool's name. They stay as data although the identity
# rule now refuses all five on its own (four are short or English-word names
# without corroboration, and `ggplot` is contradicted): a reviewed rejection
# should not depend on a heuristic continuing to hold.
# ---------------------------------------------------------------------------
review:
  date: '2026-08-21'
  matches_reviewed: 94

excluded_matches:
  - tool: bart
    registry: bioconda
    reason: the corpus tool is MS-BART, a language model over mass spectra; the package is a bacterial read typer
  - tool: grid
    registry: bioconda
    reason: the corpus tool is R's base grid graphics; the package is GRiD, a bacterial growth-rate index
  - tool: meteor
    registry: bioconda
    reason: the corpus tool is MeTEor, an R app for time-series metabolomics; the package is a metagenomics profiler
  - tool: mist
    registry: bioconductor
    reason: the corpus tool is MIST, a mass-spectra annotation model; the package does differential methylation for scDNAm
  - tool: ggplot
    registry: bioconda
    reason: the corpus tool is the R package ggplot2; the package is an unmaintained Python re-implementation
